name: Telegram bot v2 and meme pipeline tests
on:
  push:
    branches:
      - feature/minimal-checklist-tracker
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all code
        run: python -m compileall -q bot.py backup_before_upgrade.py v2_experience.py v2_data.py harm_reduction.py stats_dashboard.py context_memes.py photo_memes.py meme_engine.py real_memes.py dark_memes.py mellstroy_bank.py meme_studio.py meme_ai.py meme_vision.py meme_harvester.py meme_review_store.py meme_collector.py
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Verify old-school Russian photo meme overlays
        run: python -c "import real_memes as m; from PIL import Image; from io import BytesIO; im=Image.new(\"RGB\",(800,950)); mem=BytesIO(); im.save(mem,format=\"JPEG\"); x=m.compose(mem.getvalue(),\"ПОШАЛИМ?\",\"НЕ НАДО, БРАТ\",1); assert Image.open(BytesIO(x)).size == (850,960)"
