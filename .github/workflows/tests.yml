name: Python meme engine tests
on:
  push:
    branches:
      - feature/minimal-checklist-tracker
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all code
        run: python -m compileall -q bot.py meme_studio.py meme_ai.py meme_vision.py meme_harvester.py meme_review_store.py meme_collector.py
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Render 16 original meme images
        run: python -c "import tempfile; import meme_studio as s; from pathlib import Path; d=tempfile.TemporaryDirectory(); assert len(s.ensure_catalog(Path(d.name), limit=16)) == 16; d.cleanup()"
